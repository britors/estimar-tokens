name: Validar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts Python compilam
        run: python3 -m py_compile skills/estimar-tokens/scripts/*.py
      - name: Modo estimativa desligado não imprime nada
        run: |
          export HOME=$(mktemp -d)
          M=skills/estimar-tokens/scripts/modo.py
          test -z "$(echo '{"session_id":"s1"}' | python3 $M hook-inicio)"
          test -z "$(echo '{"session_id":"s1","prompt":"x"}' | python3 $M hook-pedido)"
          test -z "$(echo '{"session_id":"s1"}' | python3 $M hook-parar)"
      - name: Status line grava o saldo
        run: |
          export HOME=$(mktemp -d)
          echo '{"context_window":{"total_input_tokens":1000,"used_percentage":1},"rate_limits":{"five_hour":{"used_percentage":10,"resets_at":2000000000}}}' \
            | python3 skills/estimar-tokens/scripts/statusline.py | grep -q '^5h ▊░* 10%'
          python3 skills/estimar-tokens/scripts/saldo.py
      - name: Manifesto do plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Estimativa e custo real exportam Markdown
        run: |
          export HOME=$(mktemp -d)
          S=skills/estimar-tokens/scripts
          python3 $S/estimar.py --etapa "a|2|5" --contexto 100 --modelo claude-opus-5-5 --md /tmp/e.md
          grep -q 'US\$ ' /tmp/e.md
          mkdir -p $HOME/.claude/projects/p
          echo '{"type":"assistant","timestamp":"2026-11-10T10:00:00Z","message":{"id":"m1","model":"claude-opus-5-5","usage":{"input_tokens":10,"cache_creation_input_tokens":1000,"cache_read_input_tokens":100000,"output_tokens":500,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":1000}}}}' > $HOME/.claude/projects/p/s1.jsonl
          python3 $S/custo_real.py --sessao s1 --md /tmp/r.md
          grep -q 'US\$ 0,04' /tmp/r.md
          echo "{\"transcript_path\":\"$HOME/.claude/projects/p/s1.jsonl\"}" \
            | python3 $S/statusline.py | grep -q '^sessão 101,5 mil tokens (1,5 mil novos) · US\$ 0,04$'
      - name: Modo estimativa compara estimado x realizado
        run: |
          export HOME=$(mktemp -d)
          S=skills/estimar-tokens/scripts
          echo '{"session_id":"s1","prompt":"/estimar-tokens on"}' | python3 $S/modo.py hook-pedido | grep -q ligado
          echo '{"session_id":"s1","prompt":"corrigir bug"}' | python3 $S/modo.py hook-pedido | grep -q 'registrar s1'
          python3 $S/estimar.py --registrar s1 --titulo "Corrigir bug" --etapa "a|2|5" --contexto 100 --modelo claude-opus-5-5
          mkdir -p $HOME/.claude/projects/p
          echo "{\"type\":\"assistant\",\"timestamp\":\"$(date -u -d '+1 min' +%Y-%m-%dT%H:%M:%SZ)\",\"message\":{\"id\":\"m1\",\"model\":\"claude-opus-5-5\",\"usage\":{\"input_tokens\":10,\"cache_creation_input_tokens\":1000,\"cache_read_input_tokens\":100000,\"output_tokens\":500}}}" > $HOME/.claude/projects/p/s1.jsonl
          echo '{"session_id":"s1"}' | python3 $S/modo.py hook-parar | grep -q '"block"'
          python3 $S/comparar.py --sessao s1 | grep -q '| Custo | US\$ 0,10 | US\$ 0,04 |'
          test -z "$(echo '{"session_id":"s1"}' | python3 $S/modo.py hook-parar)"
          echo '{"session_id":"s1","prompt":"/estimar-tokens off"}' | python3 $S/modo.py hook-pedido | grep -q desligado
      - name: Setup liga o modo nas sessões novas
        run: |
          export HOME=$(mktemp -d)
          M=skills/estimar-tokens/scripts/modo.py
          python3 $M config | grep -q desligado
          python3 $M config on | grep -q ligado
          echo '{"session_id":"s2"}' | python3 $M hook-inicio | grep -q ligado
          echo '{"session_id":"s2","prompt":"x"}' | python3 $M hook-pedido | grep -q 'registrar s2'
          python3 $M config off | grep -q desligado
          test -z "$(echo '{"session_id":"s3"}' | python3 $M hook-inicio)"
          python3 $M status --sessao s2 | grep -q ligado
