name: Validar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts Python compilam
        run: python3 -m py_compile skills/estimar-tokens/scripts/*.py hooks/*.py
      - name: Hook desligado não imprime nada
        run: test -z "$(HOME=$(mktemp -d) python3 hooks/lembrete.py)"
      - name: Status line grava o saldo
        run: |
          export HOME=$(mktemp -d)
          echo '{"context_window":{"total_input_tokens":1000,"used_percentage":1},"rate_limits":{"five_hour":{"used_percentage":10,"resets_at":2000000000}}}' \
            | python3 skills/estimar-tokens/scripts/statusline.py | grep -q '5h 10%'
          python3 skills/estimar-tokens/scripts/saldo.py
      - name: Manifesto do plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Estimativa e custo real exportam Markdown
        run: |
          export HOME=$(mktemp -d)
          S=skills/estimar-tokens/scripts
          python3 $S/estimar.py --etapa "a|2|5" --contexto 100 --modelo claude-opus-5-5 --md /tmp/e.md
          grep -q 'US\$ ' /tmp/e.md
          mkdir -p $HOME/.claude/projects/p
          echo '{"type":"assistant","timestamp":"2026-11-10T10:00:00Z","message":{"id":"m1","model":"claude-opus-5-5","usage":{"input_tokens":10,"cache_creation_input_tokens":1000,"cache_read_input_tokens":100000,"output_tokens":500,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":1000}}}}' > $HOME/.claude/projects/p/s1.jsonl
          python3 $S/custo_real.py --sessao s1 --md /tmp/r.md
          grep -q 'US\$ 0,04' /tmp/r.md
